name: Attest catalog

on:
  push:
    branches: [main]
    paths:
      - "marketplace.json"
      - ".github/workflows/attest-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: attest-marketplace-catalog
  cancel-in-progress: false

jobs:
  attest:
    name: Sigstore provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Attest marketplace.json
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: marketplace.json

      - name: Publish detached verification bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" marketplace.sigstore.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.sigstore.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update marketplace attestation"
          git push
