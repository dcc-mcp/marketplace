name: marketplace-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "marketplace.json"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "marketplace.json"
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate marketplace.json against schema
        run: >
          check-jsonschema
          --schemafile schemas/marketplace-v1.schema.json
          marketplace.json

      - name: Validate example files against schema
        run: |
          for f in examples/*.json; do
            echo "::group::Validating $f"
            check-jsonschema --schemafile schemas/marketplace-v1.schema.json "$f"
            echo "::endgroup::"
          done

  check-uniqueness:
    name: Metadata policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator test dependency
        run: pip install jsonschema

      - name: Run metadata and uniqueness checks
        run: |
          python scripts/validate_marketplace.py uniqueness
          python scripts/validate_marketplace.py metadata

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  smoke-test:
    name: Dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source URLs are reachable
        run: python scripts/validate_marketplace.py reachability

      - name: Verify pinned git revisions remain reachable
        run: python scripts/validate_marketplace.py source-revisions

      - name: Verify declared skill roots at pinned revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_marketplace.py skill-layout

      - name: Verify asset descriptor contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_marketplace.py asset-contract

      - name: Validate with dcc-mcp-catalog (if available)
        run: python scripts/validate_marketplace.py catalog-parse
