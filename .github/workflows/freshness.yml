name: marketplace-freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Report source freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report upstream commits awaiting review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_marketplace.py source-freshness
