name: marketplace-source-refresh

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marketplace-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Prepare reviewed source-pin refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the automation branch from main
        run: |
          branch=automation/refresh-source-pins
          # Keep a remote-tracking ref so the later --force-with-lease push has a
          # known base. Ignore the failure when the branch does not exist yet.
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          # Always rebuild the candidate from main instead of rebasing the previous
          # one. Every pin is recomputed from upstream on each run, so a carried-over
          # diff can only go stale; rebasing it used to conflict on marketplace.json
          # and left the refresh red every week.
          git switch -C "$branch" origin/main

      - name: Refresh official source pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_source_pins.py --write

      - name: Detect changes
        id: changes
        run: echo "present=$([[ -n $(git status --porcelain) ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install validation dependency
        if: steps.changes.outputs.present == 'true'
        run: pip install jsonschema

      - name: Validate proposed catalog
        if: steps.changes.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_marketplace.py all

      - name: Commit and push draft update
        if: steps.changes.outputs.present == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add marketplace.json
          git commit -m "chore: refresh source pins"
          git push --force-with-lease origin HEAD:automation/refresh-source-pins

      - name: Create draft pull request
        if: steps.changes.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/refresh-source-pins
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
              --title "chore: refresh source pins" \
              --body "Automated candidate update. Review upstream changes, license implications, and each skill version before merging. This workflow never merges the PR."
          fi
